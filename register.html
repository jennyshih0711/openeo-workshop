rder-radius:12px;color:#6f5713;font-size:14px}.hidden{display:none!important}#register,#groups,#admin{display:none!important}#register.active,#groups.active,#admin.active{display:block!important}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer;font-weight:700;color:var(--muted)}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.group h3{margin:0 0 10px}.member{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.member:last-child{border-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:30px;display:block;color:var(--navy)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}th{background:#f1f6f9;color:var(--muted)}footer{background:var(--navy);color:#cfe1ed;padding:30px 0;font-size:14px}.modal{position:fixed;inset:0;background:rgba(8,28,46,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .panel{max-width:420px;width:100%}@media(max-width:800px){.hero-grid,.form-wrap{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.navlinks{gap:10px;font-size:13px}.hero{padding-top:48px}section{padding:54px 0}}

<body><nav class="nav"><div class="shell navin"><div class="brand">國土治理數據整合平台<small>NCHC × openEO WORKSHOP</small></div><a href="index.html">返回首頁</a></div></nav><div id="cloudStatus" class="notice hidden" role="status" style="max-width:1112px;margin:12px auto"></div><main class="registration-workspace"><section id="register"><div class="shell form-wrap"><div><div class="kicker">JOIN US</div><h2>完成報名，加入工作坊</h2><p class="lead">請填寫正確資料，方便活動通知與餐飲準備。送出後即可在右側選擇姓名加入組別。</p><div class="notice">系所預設為「國立金門大學都市計畫與景觀學系」，也可自行輸入其他系所。</div></div><form class="panel" id="regForm"><label for="name">姓名</label><input id="name" required placeholder="請輸入姓名"><label for="email">電子郵件</label><input id="email" type="email" required placeholder="name@example.com"><label for="phone">聯絡電話</label><input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="請輸入聯絡電話"><label for="dept">系所</label><input id="dept" list="deptList" value="國立金門大學都市計畫與景觀學系" required><datalist id="deptList"><option>國立金門大學都市計畫與景觀學系</option><option>國立金門大學其他系所</option></datalist><label for="meal">餐飲需求</label><select id="meal"><option value="葷食">葷食</option><option value="素食">素食</option></select><p style="font-size:14px;color:var(--muted)">報名姓名會顯示於分組名單；電子郵件與電話僅供辦理單位聯繫使用。</p><button class="btn" type="submit">送出報名</button><div id="regMsg" class="notice hidden" style="margin-top:16px"></div></form></div></section><section id="groups" style="background:#eef5f8"><div class="shell"><div class="section-head"><div><div class="kicker">TEAM FORMATION</div><h2>分組登記</h2><p class="lead">每組 3 人。從各組下拉選單選擇尚未分組的已報名學員。</p></div></div><div class="unassigned-box"><h3>尚未分組</h3><p>若未完成分組將由辦理單位協助分配</p><div id="unassignedNames" class="unassigned-names" aria-live="polite"></div></div><div id="groupHint" class="notice">請先完成報名，再進行分組。</div><div class="groups" id="groupsGrid" style="margin-top:18px"></div><div class="group-actions"><button class="btn" id="newGroupBtn">建立新組別</button></div></div></section></main><style>#register,#groups{display:block!important;scroll-margin-top:90px}</style><script type="module" src="registration.js?v=20261005-2"></script></body></html>
